<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Pre-React splash overlay (member products only): static markup + styles, no scripts —
         script-src 'self' forbids inline scripts, so the main process drives all behavior via
         executeJavaScript (scene swap) and the renderer fades it out once initialized. The
         generic build never presents this: the main process removes it before first show. -->
    <style>
      #vclaw-splash { position: fixed; inset: 0; z-index: 2147483647; pointer-events: none;
        background: radial-gradient(120% 120% at 30% 20%, #16181f 0%, #0a0b0f 62%);
        display: flex; align-items: center; justify-content: center;
        opacity: 1; transition: opacity 300ms ease }
      #vclaw-splash.vclaw-splash--hidden { opacity: 0 }
      .vclaw-splash__wordmark { font: 700 40px/1.15 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
        letter-spacing: .08em; color: #f4f4f5; text-shadow: 0 2px 14px rgba(0, 0, 0, .45) }
      .vclaw-splash__wordmark small { display: block; margin-top: 10px;
        font: 500 15px/1.3 ui-sans-serif, -apple-system, system-ui, sans-serif;
        letter-spacing: .04em; color: rgba(196, 181, 253, .92);
        text-shadow: 0 1px 8px rgba(0, 0, 0, .5) }
      .vclaw-splash__stack { display: flex; flex-direction: column; align-items: center; }
      .vclaw-splash__pet { width: 120px; height: 130px; margin-bottom: 18px;
        background: url(/vclaw-splash-pet.png) 0 0 / 720px 130px no-repeat;
        animation: vclaw-splash-pet-blink 1.1s steps(1, end) infinite, vclaw-splash-pet-bob 2.2s ease-in-out infinite;
        filter: drop-shadow(0 10px 24px rgba(94, 63, 190, .35)) }
      /* Frame durations mirror the pet's idle row exactly: 280/110/110/140/140/320 ms of 1100. */
      @keyframes vclaw-splash-pet-blink {
        0%, 25.4% { background-position-x: 0 }
        25.5%, 35.4% { background-position-x: -120px }
        35.5%, 45.4% { background-position-x: -240px }
        45.5%, 58.1% { background-position-x: -360px }
        58.2%, 70.9% { background-position-x: -480px }
        71%, 100% { background-position-x: -600px }
      }
      @keyframes vclaw-splash-pet-bob {
        0%, 100% { transform: translateY(0) scale(1) }
        50% { transform: translateY(-5px) scale(1.02, .98) }
      }
      .vclaw-splash__bar { position: absolute; left: 50%; bottom: 66px; width: 180px; height: 2px; margin-left: -90px;
        border-radius: 2px; background: #26272e; overflow: hidden }
      .vclaw-splash__bar i { position: absolute; top: 0; left: 0; height: 100%; width: 40%; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #a8a29e); animation: vclaw-splash-slide 1.6s ease-in-out infinite }
      @keyframes vclaw-splash-slide { from { transform: translateX(-120%) } to { transform: translateX(320%) } }
      #vclaw-splash .vclaw-splash__scene { position: absolute; inset: 0; display: none }
      #vclaw-splash.vclaw-splash--scene .vclaw-splash__scene { display: block }
      #vclaw-splash.vclaw-splash--scene .vclaw-splash__bar,
      #vclaw-splash.vclaw-splash--scene .vclaw-splash__stack { display: none }
      .vclaw-splash__frame, .vclaw-splash__poster { position: absolute; inset: 0; width: 100%; height: 100%; border: 0 }
      .vclaw-splash__ambient { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;
        transition: opacity 900ms ease }
      #vclaw-splash.vclaw-splash--ambient .vclaw-splash__ambient { opacity: 1 }
      #vclaw-splash.vclaw-splash--scene.vclaw-splash--ambient .vclaw-splash__ambient { opacity: .55 }
      .vclaw-splash__ambient circle { animation: vclaw-splash-drift 12s ease-in-out infinite alternate }
      @keyframes vclaw-splash-drift {
        from { transform: translate(0, 0) }
        to { transform: translate(calc(var(--dx, .2) * var(--spd, .6) * 14px), calc(var(--dy, .2) * var(--spd, .6) * 14px)) }
      }
      .vclaw-splash__ambient line { animation: vclaw-splash-pulse 7s ease-in-out infinite alternate }
      @keyframes vclaw-splash-pulse { from { opacity: .3 } to { opacity: 1 } }
      .vclaw-splash__poster { object-fit: cover;
        opacity: 0; filter: blur(14px) saturate(.8); transform: scale(1.14);
        transition: opacity 800ms ease, filter 800ms ease, transform 800ms cubic-bezier(.22, 1, .36, 1) }
      #vclaw-splash.vclaw-splash--presented .vclaw-splash__poster {
        opacity: 1; filter: blur(0) saturate(1); transform: scale(1.06);
        animation: vclaw-splash-kenburns 16s ease-in-out 800ms infinite alternate }
      @keyframes vclaw-splash-kenburns {
        from { transform: scale(1.06) translate(-1.5%, -1%) }
        to { transform: scale(1.17) translate(1.5%, 1.2%) }
      }
      .vclaw-splash__title { position: absolute; left: 28px; right: 28px; bottom: 64px; display: none;
        font: 600 30px/1.15 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
        color: rgba(244, 244, 245, .96); text-shadow: 0 2px 18px rgba(0, 0, 0, .7) }
      #vclaw-splash.vclaw-splash--presented .vclaw-splash__title { display: block }
      .vclaw-splash__title-word { display: inline-block; opacity: 0; transform: translateY(14px);
        animation: vclaw-splash-word-rise 700ms cubic-bezier(.22, 1, .36, 1) forwards }
      @keyframes vclaw-splash-word-rise { to { opacity: 1; transform: translateY(0) } }
      .vclaw-splash__author { display: block; margin-top: 6px;
        font: 400 12px/1.3 ui-sans-serif, system-ui, sans-serif; letter-spacing: .04em;
        color: rgba(244, 244, 245, .66); text-shadow: 0 1px 8px rgba(0, 0, 0, .7);
        opacity: 0; animation: vclaw-splash-author-in 600ms ease 650ms forwards }
      @keyframes vclaw-splash-author-in { to { opacity: 1 } }
      .vclaw-splash__spec { position: absolute; right: 20px; bottom: 18px; display: none; max-width: 46%;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none;
        font: 400 10px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: rgba(244, 244, 245, .42); text-shadow: 0 1px 4px rgba(0, 0, 0, .8) }
      #vclaw-splash.vclaw-splash--presented .vclaw-splash__spec { display: block }
      .vclaw-splash__vignette { position: absolute; inset: 0; pointer-events: none; display: none;
        background:
          linear-gradient(180deg, rgba(10, 14, 25, .28) 0%, rgba(10, 14, 25, 0) 30%),
          linear-gradient(0deg, rgba(10, 14, 25, .62) 0%, rgba(10, 14, 25, 0) 38%) }
      #vclaw-splash.vclaw-splash--scene .vclaw-splash__vignette { display: block }
      .vclaw-splash__mark { position: absolute; left: 28px; bottom: 24px; pointer-events: none; display: none;
        font: 600 15px/1.2 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
        letter-spacing: .18em; color: rgba(244, 244, 245, .92); text-shadow: 0 1px 10px rgba(0, 0, 0, .6) }
      #vclaw-splash.vclaw-splash--scene .vclaw-splash__mark { display: block }
      .vclaw-splash__attribution { display: block; margin-top: 5px;
        font: 400 10.5px/1.3 ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em;
        color: rgba(244, 244, 245, .6); text-shadow: 0 1px 6px rgba(0, 0, 0, .6) }
      .vclaw-splash__attribution:empty { display: none }
      @media (prefers-reduced-motion: reduce) { #vclaw-splash, #vclaw-splash * { animation: none !important } }
    </style>
   </head>
  <body>
    <div id="vclaw-splash" aria-hidden="true">
      <div class="vclaw-splash__scene"></div>
      <div class="vclaw-splash__vignette"></div>
      <div class="vclaw-splash__stack">
        <div class="vclaw-splash__pet"></div>
        <div class="vclaw-splash__wordmark">VizMaster<small>powered by VClaw</small></div>
      </div>
      <div class="vclaw-splash__bar"><i></i></div>
      <h2 class="vclaw-splash__title"></h2>
      <div class="vclaw-splash__mark">VClaw<small class="vclaw-splash__attribution"></small></div>
      <div class="vclaw-splash__spec"></div>
    </div>
    <div id="root"></div><script type="module" src="/src/main.tsx"></script>
  </body>
</html>
