# ── VLink subject reservation for the shared pi-a2a NATS server ──────────────
#
# This file is DOCUMENTATION + an optional ACL fragment. It is not currently
# included by A2A/pi-a2a/config/nats-ipc.conf, because that server uses token
# auth with default_permissions [">"], which already authorizes the VLink
# subjects. No NATS restart is required for the v1 scaffold.
#
# VLink never starts its own broker. It connects to:
#   nats://127.0.0.1:14222
# with the token in ~/.config/pi-a2a/server.seed (same as pi-a2a).
#
# Reserved namespace:
#   iot.matter.<fabric>.<node>.<endpoint>.<cluster>.<attribute>   publish
#   iot.event.matter.<fabric>.<node>.<endpoint>.<cluster>.<event> publish
#   iot.bridge.vlink.<instance>.status                            publish
#   iot.cmd.matter.<fabric>.<node>.<endpoint>.<cluster>.<command> subscribe
#   iot.cmd.matter.<fabric>.bridge.<action>                       subscribe
#
# If the shared server is ever moved from default_permissions to restricted
# users, the VLink user needs this permission set (illustrative only — do not
# paste this block into an `authorization { token: ... }` section, which cannot
# also define users):
#
#   permissions = {
#     publish:   ["iot.matter.>", "iot.event.matter.>", "iot.bridge.vlink.>"]
#     subscribe: ["iot.cmd.matter.>", "iot.matter.>", "iot.event.matter.>", "_INBOX.>"]
#   }
#
# Keep iot.> separate from agents.>, a2a.>, $SRV.>, and $KV.>; pi-a2a owns those.
