name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish (for example, v0.2.0)
        required: true
        type: string
      include_windows:
        description: Build signed Windows packages (requires Authenticode secrets)
        required: false
        default: false
        type: boolean
      include_windows_unsigned:
        description: Build unsigned Windows packages for free beta distribution
        required: false
        default: false
        type: boolean
      member:
        description: 'Member id to bake as an overlay (for example vizmaster). Empty = generic build only.'
        required: false
        default: ''
        type: string
      member_repo:
        description: 'Member repo, owner/name (required when member is set)'
        required: false
        default: ''
        type: string
      member_ref:
        description: 'Member commit sha to pin, full 40 characters (required when member is set)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.tag || github.ref }}
  RELEASE_WINDOWS_SIGNED_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_windows) || (github.event_name == 'push' && vars.RELEASE_WINDOWS_ENABLED == 'true') }}
  RELEASE_WINDOWS_UNSIGNED_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_windows_unsigned) || (github.event_name == 'push' && vars.RELEASE_WINDOWS_UNSIGNED_ENABLED == 'true') }}
  RELEASE_WINDOWS_ENABLED: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.include_windows || inputs.include_windows_unsigned)) || (github.event_name == 'push' && (vars.RELEASE_WINDOWS_ENABLED == 'true' || vars.RELEASE_WINDOWS_UNSIGNED_ENABLED == 'true'))) }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    # Every downstream job checks out this commit SHA instead of the tag, so a
    # tag moved mid-run cannot make two jobs build different commits.
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - run: npm run release:preflight:toolchain
      - name: Validate tag and package versions
        run: node scripts/release/validate-release-tag.mjs --tag "$RELEASE_TAG"
      # fetch-depth: 0 above is what populates refs/remotes/origin/*; the check
      # is evaluated against main's tip at run time, so a commit that is on main
      # when the release starts can still be rewritten out of main afterwards.
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Pin the release to the resolved commit SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"

  production-audit:
    name: Production dependency audit
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - run: npm run release:preflight:toolchain
      - name: Apply named production dependency audit exceptions
        run: npm run audit:production

  quality:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm run release:verify:package

  hermetic-e2e:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm run build:bundle
      - run: npm run test:e2e:hermetic

  package:
    needs: [validate, production-audit, quality, hermetic-e2e]
    strategy:
      # Ship both mac architectures as separate DMG/ZIP builds. Each leg runs
      # on a runner whose native architecture matches the target so
      # install-app-deps never cross-compiles node-pty or zeromq, and one
      # leg's failure never cancels the other's signed build.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - name: Fail closed unless every release credential is configured
        run: npm run release:preflight
        env:
          RELEASE_SIGNING_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # CI runs the full typecheck/lint/test suite for this commit; the release
      # job only builds the bundle, packages, and runs post-package verification.
      - name: Build, sign, notarize, and verify release packages
        run: npm run package:mac -- --skip-verify --arch ${{ matrix.arch }}
        env:
          RELEASE_SIGNING_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vclaw-public-macos-${{ matrix.arch }}
          path: |
            release/mac/${{ matrix.arch }}/*.dmg
            release/mac/${{ matrix.arch }}/*.zip
            release/mac/${{ matrix.arch }}/latest*.yml
          if-no-files-found: error

  package-member:
    # A MEMBER build is the same pipeline with a member overlay baked in, so one
    # certificate and one notarization path serve both the generic product and each
    # member. The member owner supplies the contract (recorded in chatek/vchat.email
    # docs/lanes/VCLAW_RELEASE_STRATEGY_2026-10-30.md):
    #   checkout member @ pinned sha -> npm run bundle:<member> (payload archive)
    #   -> npm run integrate:<member> -- --vclaw <this checkout> (idempotent, --check gates drift)
    #   -> package:mac --member <member> -> verify the MOUNTED dmg -> SHA256SUMS
    # The generic `package` job never runs member steps, so the product artifact
    # stays brand-clean (operator directive: VClaw's branding belongs to vclawhub.com).
    needs: [validate, production-audit, quality, hermetic-e2e]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.member != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      MEMBER_ID: ${{ inputs.member }}
      MEMBER_REPO: ${{ inputs.member_repo }}
      MEMBER_REF: ${{ inputs.member_ref }}
      # Script names live in the member repo; defaults match the VizMaster contract.
      MEMBER_BUNDLE_SCRIPT: ${{ vars.MEMBER_BUNDLE_SCRIPT || 'bundle:vcclaw' }}
      MEMBER_INTEGRATE_SCRIPT: ${{ vars.MEMBER_INTEGRATE_SCRIPT || 'integrate:vcclaw' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Fail closed on an incomplete member request
        run: |
          test -n "$MEMBER_REPO" || { echo "::error::member_repo is required when member is set"; exit 1; }
          test -n "$MEMBER_REF"  || { echo "::error::member_ref is required when member is set"; exit 1; }
          printf '%s' "$MEMBER_REF" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::member_ref must be a full 40-character sha"; exit 1; }
          test -n "$MEMBER_TOKEN" || { echo "::error::secret MEMBER_REPO_TOKEN is not configured"; exit 1; }
        env:
          MEMBER_TOKEN: ${{ secrets.MEMBER_REPO_TOKEN }}
      - name: Fetch the member repo at the pinned sha
        # A second actions/checkout would need the token as an ACTION INPUT, which this
        # repo's secret-confinement rule forbids; git + an env-var token keeps the
        # secret where the rule allows it. The sha is fetched directly, so no branch tip
        # can be substituted.
        run: |
          set -euo pipefail
          mkdir -p member
          cd member
          git init --quiet
          git remote add origin "https://x-access-token:${MEMBER_TOKEN}@github.com/${MEMBER_REPO}.git"
          git fetch --quiet --depth 1 origin "$MEMBER_REF"
          git checkout --quiet FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$MEMBER_REF" || { echo "::error::member checkout is not the pinned sha"; exit 1; }
        env:
          MEMBER_TOKEN: ${{ secrets.MEMBER_REPO_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm run toolchain:bootstrap
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - name: Install member dependencies
        run: npm ci
        working-directory: member
      # The emitter runs BEFORE the bundle and BEFORE integrate: build-info reads the vclaw
      # checkout's tracked state, and integrate deliberately dirties that checkout. Emitting
      # after integrate would stamp vclawDirty: true and fail the mounted-dmg assert.
      - name: Emit member provenance for the payload
        run: VCLAW_SRC="$GITHUB_WORKSPACE" node scripts/build-info.mjs --out app/build
        working-directory: member
      - name: Bundle the member payload at the pinned sha
        run: npm run "$MEMBER_BUNDLE_SCRIPT"
        working-directory: member
      - name: Integrate the overlay into this checkout (idempotent, drift-gated)
        run: npm run "$MEMBER_INTEGRATE_SCRIPT" -- --vclaw "$GITHUB_WORKSPACE"
        working-directory: member
      - name: Integrate drift check (must already be integrated)
        run: npm run "$MEMBER_INTEGRATE_SCRIPT" -- --vclaw "$GITHUB_WORKSPACE" --check
        working-directory: member
      - name: Fail closed unless every release credential is configured
        run: npm run release:preflight
        env:
          RELEASE_SIGNING_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build, sign, notarize the member package
        run: npm run package:mac -- --skip-verify --arch ${{ matrix.arch }} --member "$MEMBER_ID" --profile "product/$MEMBER_ID.json"
        env:
          RELEASE_SIGNING_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify the dmg carries the member payload at the pinned sha
        run: |
          set -euo pipefail
          DMG=$(ls release/mac/${{ matrix.arch }}/*.dmg | head -n 1)
          test -n "$DMG" || { echo "::error::no dmg produced"; exit 1; }
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          BUILD="$MOUNT/VClaw.app/Contents/Resources/product/payload/BUILD.json"
          test -f "$BUILD" || { echo "::error::member payload BUILD.json missing from the dmg"; exit 1; }
          cat "$BUILD"
          # Handoff metadata: keep the payload's provenance BESIDE the dmg, so the handoff
          # directory carries the vclaw sha (vclawCommit/vclawVersion) without inferring it
          # from artifact-name ordering.
          cp "$BUILD" "release/mac/${{ matrix.arch }}/BUILD.json"
          node -e '
            const fs = require("node:fs");
            const b = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const pinned = process.argv[2];
            const vclawSha = process.argv[3] || "";
            const need = ["vizmasterVersion", "vizmasterCommit", "vclawVersion", "vclawCommit", "builtAt"];
            const missing = need.filter((k) => !String(b[k] || "").trim());
            if (missing.length) { console.error("::error::BUILD.json missing " + missing.join(", ")); process.exit(1); }
            // BUILD.json records SHORT shas (measured in the 2026-10-30 rehearsal:
            // vizmasterCommit=7263596 for pin 72635969f9...). Compare as a prefix of
            // the full sha; an exact-equality assert fails on format alone.
            if (!pinned.startsWith(b.vizmasterCommit)) { console.error("::error::payload built from " + b.vizmasterCommit + ", expected a prefix of " + pinned); process.exit(1); }
            if (vclawSha && !vclawSha.startsWith(b.vclawCommit)) { console.error("::error::payload built against VClaw " + b.vclawCommit + ", expected a prefix of " + vclawSha); process.exit(1); }
            if (b.dirty === true || b.vclawDirty === true) { console.error("::error::payload was built from a dirty tree"); process.exit(1); }
            console.log("payload pins ok: vizmaster " + b.vizmasterCommit + " (pin " + pinned + "), vclaw " + b.vclawCommit);
          ' "$BUILD" "$MEMBER_REF" "$GITHUB_SHA"
      - name: Checksums
        run: |
          cd release/mac/${{ matrix.arch }}
          shasum -a 256 ./*.dmg ./*.zip ./BUILD.json > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the immutable staging prefix for the handoff
        run: >-
          node scripts/release/publish-member-staging.mjs
          --dir "release/mac/${{ matrix.arch }}"
          --member "$MEMBER_ID"
          --arch "${{ matrix.arch }}"
          --vclaw-sha "$GITHUB_SHA"
          --branch "$GITHUB_REF_NAME"
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vclaw-member-${{ inputs.member }}-macos-${{ matrix.arch }}
          path: |
            release/mac/${{ matrix.arch }}/*.dmg
            release/mac/${{ matrix.arch }}/*.zip
            release/mac/${{ matrix.arch }}/latest*.yml
            release/mac/${{ matrix.arch }}/BUILD.json
            release/mac/${{ matrix.arch }}/handoff.json
            release/mac/${{ matrix.arch }}/tuple.json
            release/mac/${{ matrix.arch }}/SHA256SUMS
          if-no-files-found: error

  package-linux:
    needs: [validate, production-audit, quality, hermetic-e2e]
    strategy:
      # Ship both Linux architectures from native runners so npm install and
      # electron-builder package node-pty and ZeroMQ for the matching ABI.
      # Keep the legs independent so one architecture can never mask the
      # other's artifact or updater-feed failure.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            unpacked_dir: linux-arm64-unpacked
          - arch: x64
            runner: ubuntu-22.04
            unpacked_dir: linux-unpacked
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install pacman packaging dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm run package:linux -- --skip-verify --arch ${{ matrix.arch }}
      # The Linux packages install chrome-sandbox setuid-root, so the smoke restores
      # those shipped permissions rather than launching with the sandbox disabled.
      - run: |
          sudo chown root:root release/linux/${{ matrix.arch }}/${{ matrix.unpacked_dir }}/chrome-sandbox
          sudo chmod 4755 release/linux/${{ matrix.arch }}/${{ matrix.unpacked_dir }}/chrome-sandbox
      - name: Launch the packaged application
        run: node scripts/release/smoke-packaged-app.mjs --platform linux --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: packaged-smoke-diagnostics-linux-${{ matrix.arch }}
          path: release/linux/${{ matrix.arch }}/packaged-smoke-diagnostics.log
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vclaw-public-linux-${{ matrix.arch }}
          path: |
            release/linux/${{ matrix.arch }}/*.AppImage
            release/linux/${{ matrix.arch }}/*.deb
            release/linux/${{ matrix.arch }}/*.rpm
            release/linux/${{ matrix.arch }}/*.pacman
            release/linux/${{ matrix.arch }}/latest*.yml
          if-no-files-found: error

  package-windows:
    if: (github.event_name == 'workflow_dispatch' && (inputs.include_windows || inputs.include_windows_unsigned)) || (github.event_name == 'push' && (vars.RELEASE_WINDOWS_ENABLED == 'true' || vars.RELEASE_WINDOWS_UNSIGNED_ENABLED == 'true'))
    needs: [validate, production-audit, quality, hermetic-e2e]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      # Signed builds remain fail-closed and require the configured Authenticode identity.
      - name: Build, Authenticode-sign, and verify Windows packages
        if: (github.event_name == 'workflow_dispatch' && inputs.include_windows) || (github.event_name == 'push' && vars.RELEASE_WINDOWS_ENABLED == 'true')
        run: node scripts/release/package.mjs --public --platform win --skip-verify
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          VCLAW_WINDOWS_CERT_SUBJECT: ${{ vars.VCLAW_WINDOWS_CERT_SUBJECT }}
          VCLAW_WINDOWS_CERT_THUMBPRINT: ${{ vars.VCLAW_WINDOWS_CERT_THUMBPRINT }}
      - name: Build unsigned Windows packages for beta distribution
        if: (github.event_name == 'workflow_dispatch' && inputs.include_windows_unsigned && !inputs.include_windows) || (github.event_name == 'push' && vars.RELEASE_WINDOWS_UNSIGNED_ENABLED == 'true' && vars.RELEASE_WINDOWS_ENABLED != 'true')
        run: node scripts/release/package.mjs --qa --platform win --skip-verify
      # Artifacts are only publishable once the packaged executable itself boots.
      - name: Launch the packaged application
        run: node scripts/release/smoke-packaged-app.mjs --platform win --arch x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: packaged-smoke-diagnostics-win-x64
          path: release/win/x64/packaged-smoke-diagnostics.log
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vclaw-public-windows
          path: |
            release/win/**/*.exe
            release/win/**/*.zip
            release/win/**/*.appx
            release/win/**/*.msix
            release/win/**/latest*.yml
          if-no-files-found: error

  release-packages:
    needs: [validate, production-audit, package, package-linux, package-windows]
    # Always run the aggregate gate. A skipped job can satisfy a required check,
    # so failures are asserted by an explicit first step rather than encoded in
    # the job-level condition. Windows may legitimately be skipped.
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Fail if a release prerequisite did not succeed
        if: >-
          always() && (needs.validate.result != 'success' || needs.production-audit.result != 'success' ||
          needs.package.result != 'success' || needs.package-linux.result != 'success' ||
          (needs.package-windows.result != 'success' && needs.package-windows.result != 'skipped'))
        run: |
          echo "Release prerequisite results: validate=${{ needs.validate.result }}, production-audit=${{ needs.production-audit.result }}, package=${{ needs.package.result }}, package-linux=${{ needs.package-linux.result }}, package-windows=${{ needs.package-windows.result }}"
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm run toolchain:bootstrap
      # This job holds contents/attestations write, so it installs only the
      # runtime dependency tree the release script needs (js-yaml) instead of the
      # full dev toolchain.
      - name: Install release script dependencies
        run: npm ci --omit=dev --ignore-scripts
      - run: npm run release:preflight:toolchain
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: vclaw-public-*
          path: downloaded-release-artifacts
      - name: Select release assets and generate SHA-256 checksums
        run: |
          platforms='mac,linux'
          if [ "$RELEASE_WINDOWS_ENABLED" = 'true' ]; then platforms="$platforms,win"; fi
          node scripts/release/prepare-github-release.mjs --input downloaded-release-artifacts --output release-assets --tag "$RELEASE_TAG" --platforms "$platforms"
      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release-assets/*
      - name: Publish GitHub Release
        run: |
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$existing" = 'false' ]; then
            echo "Release $RELEASE_TAG is already published and will not be replaced."
            exit 1
          fi
          if [ "$existing" = 'true' ]; then
            gh release view "$RELEASE_TAG" --json assets > draft-release.json
            node scripts/release/prune-draft-release-assets.mjs --assets draft-release.json --expected release-assets > stale-assets.txt
            while IFS= read -r stale; do
              [ -n "$stale" ] || continue
              echo "Deleting stale draft asset: $stale"
              gh release delete-asset "$RELEASE_TAG" "$stale" --yes
            done < stale-assets.txt
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --verify-tag --draft=false --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --fail-on-no-commits \
              --generate-notes \
              --notes "Every installer and archive is covered by SHA256SUMS.txt and GitHub build-provenance attestations." \
              --title "VClaw ${RELEASE_TAG#v}" \
              --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Add release link to the job summary
        run: echo "Published [$RELEASE_TAG]($(gh release view "$RELEASE_TAG" --json url --jq .url))" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
