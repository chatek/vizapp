<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=720">
<title>Orbit Scatter</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent }
  .stage { position: fixed; inset: 10px; border-radius: 20px; overflow: hidden;
    background:
      radial-gradient(90% 120% at 78% 18%, #14243d 0%, rgba(20, 36, 61, 0) 55%),
      radial-gradient(100% 100% at 12% 88%, #0f2b2a 0%, rgba(15, 43, 42, 0) 55%),
      linear-gradient(155deg, #0a0e18 0%, #0c1120 55%, #090c15 100%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  svg { position: absolute; inset: 0; width: 100%; height: 100% }
  .halo { fill: none; stroke: rgba(148, 163, 184, 0.16); stroke-width: 1 }
  .ring { fill: none; stroke-width: 1.2; stroke-dasharray: 3 9;
    animation: spin 26s linear infinite; transform-origin: 360px 220px; }
  .ring.r2 { animation-duration: 38s; animation-direction: reverse }
  .ring.r3 { animation-duration: 52s }
  .points { fill: #7dd3fc; animation: twinkle 3.2s ease-in-out infinite }
  .points.warm { fill: #fbbf24 }
  .points.mint { fill: #5eead4 }
  .pulse { fill: none; stroke: #38bdf8; stroke-width: 1.4; opacity: 0;
    transform-origin: 360px 220px; animation: ripple 4s ease-out infinite; }
  .pulse.p2 { animation-delay: 2s; stroke: #a78bfa }
  .core { fill: #e2eaf6; animation: corebeat 4s ease-in-out infinite }
  @keyframes spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
  @keyframes twinkle { 0%, 100% { opacity: 0.45 } 50% { opacity: 1 } }
  @keyframes ripple { 0% { transform: scale(0.25); opacity: 0.85 } 80% { opacity: 0.12 } 100% { transform: scale(1.05); opacity: 0 } }
  @keyframes corebeat { 0%, 100% { opacity: 0.85 } 50% { opacity: 1 } }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 720 480" preserveAspectRatio="xMidYMid slice">
    <ellipse class="halo" cx="360" cy="220" rx="120" ry="46"/>
    <ellipse class="halo" cx="360" cy="220" rx="190" ry="74"/>
    <ellipse class="halo" cx="360" cy="220" rx="262" ry="104"/>
    <g class="ring" stroke="#38bdf8" opacity="0.5"><ellipse cx="360" cy="220" rx="155" ry="60"/></g>
    <g class="ring r2" stroke="#a78bfa" opacity="0.5"><ellipse cx="360" cy="220" rx="225" ry="88"/></g>
    <g class="ring r3" stroke="#5eead4" opacity="0.45"><ellipse cx="360" cy="220" rx="295" ry="116"/></g>
    <circle class="pulse" cx="360" cy="220" r="150"/>
    <circle class="pulse p2" cx="360" cy="220" r="150"/>
    <circle class="core" cx="360" cy="220" r="4.5"/>
    <g class="points">
      <circle cx="298" cy="196" r="3.4"/>
      <circle cx="428" cy="182" r="2.6"/>
      <circle cx="452" cy="252" r="3.1"/>
      <circle cx="318" cy="266" r="2.4"/>
    </g>
    <g class="points warm" style="animation-delay:.7s">
      <circle cx="252" cy="238" r="2.8"/>
      <circle cx="386" cy="158" r="2.2"/>
      <circle cx="508" cy="216" r="2.9"/>
    </g>
    <g class="points mint" style="animation-delay:1.3s">
      <circle cx="348" cy="304" r="2.6"/>
      <circle cx="416" cy="286" r="3.2"/>
      <circle cx="272" cy="172" r="2.3"/>
      <circle cx="472" cy="300" r="2.4"/>
    </g>
    <g stroke="rgba(125,211,252,0.22)" stroke-width="1">
      <path d="M298 196 L360 220 L428 182 M360 220 L452 252 M360 220 L318 266 M360 220 L252 238 M360 220 L386 158 M360 220 L508 216 M360 220 L348 304 M360 220 L416 286 M360 220 L272 172 M360 220 L472 300"/>
    </g>
    <g fill="rgba(226,234,246,0.5)">
      <circle cx="92" cy="86" r="1.4"/><circle cx="150" cy="60" r="1.1"/><circle cx="620" cy="96" r="1.3"/>
      <circle cx="672" cy="150" r="1.1"/><circle cx="70" cy="330" r="1.2"/><circle cx="646" cy="388" r="1.4"/>
      <circle cx="204" cy="418" r="1.2"/><circle cx="540" cy="52" r="1.2"/><circle cx="120" cy="428" r="1.1"/>
    </g>
  </svg>
</div>
</body>
</html>
